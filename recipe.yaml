version: 1.0.0
title: Goose Worker Orchestration with Telsiz Pattern
description: A recipe for launching and managing Goose ACP workers using the tools-bank goused system, with telsiz (wireless) agent communication protocol.
instructions: Use goose_start to launch workers with specific recipes (e.g., from /root/tools-bank/recipes/) and unique session_ids. Monitor worker status with goose_status. Stop workers with goose_stop when done. The telsiz pattern enables agent-to-agent messaging via agent_register (capabilities), agent_send, and agent_receive (long-poll). Register agents with their capabilities before sending messages. Use agent_receive with appropriate timeout (default 30s) to wait for responses. Always use unique session_ids and track active sessions.
extensions:
- type: platform
  name: analyze
  description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
  display_name: Analyze
  bundled: true
  available_tools: []
- type: platform
  name: apps
  description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
  display_name: Apps
  bundled: true
  available_tools: []
- type: platform
  name: chatrecall
  description: Search past conversations and load session summaries for contextual memory
  display_name: Chat Recall
  bundled: true
  available_tools: []
- type: platform
  name: developer
  description: Write and edit files, and execute shell commands
  display_name: Developer
  bundled: true
  available_tools: []
- type: stdio
  name: duckduckgo
  description: Web search and page content fetching via DuckDuckGo
  cmd: /data/data/com.termux/files/usr/bin/uvx
  args:
  - duckduckgo-mcp-server
  envs: {}
  env_keys: []
  timeout: 30
  bundled: false
  available_tools: []
- type: platform
  name: Extension Manager
  description: Enable extension management tools for discovering, enabling, and disabling extensions
  display_name: Extension Manager
  bundled: true
  available_tools: []
- type: platform
  name: orchestrator
  description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
  display_name: Orchestrator
  bundled: true
  available_tools: []
- type: platform
  name: skills
  description: Discover and provide skill instructions from filesystem and builtins
  display_name: Skills
  bundled: true
  available_tools: []
- type: platform
  name: summarize
  description: Load files/directories and get an LLM summary in a single call
  display_name: Summarize
  bundled: true
  available_tools: []
- type: platform
  name: summon
  description: Load knowledge and delegate tasks to subagents
  display_name: Summon
  bundled: true
  available_tools: []
- type: platform
  name: Todo
  description: Enable a todo list for goose so it can keep track of what it is doing
  display_name: Todo
  bundled: true
  available_tools: []
- type: platform
  name: tom
  description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
  display_name: Top Of Mind
  bundled: true
  available_tools: []
- type: stdio
  name: tools-bank
  description: Memory, tasks, semantic search
  cmd: python3
  args:
  - /root/tools-bank/mcp_server/server.py
  - --stdio
  envs: {}
  env_keys: []
  timeout: 300
  bundled: false
  available_tools: []
settings:
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.0
activities:
- Launch a goose worker with a recipe
- Check worker status and health
- Stop a running goose session
- Register and communicate via telsiz
- Orchestrate multi-agent workflows
author:
  contact: root
