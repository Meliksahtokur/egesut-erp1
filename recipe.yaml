version: 1.0.0
title: EgeSüt ERP Gebelik Protokol Birleştirme
description: Bir plan dosyasını analiz edip mevcut EgeSüt ERP orkestrasyon araçları (native subagent'lar, skill'ler, recipe'ler, tools-bank Go daemon) ile implemente etme ve reviewer recipe'sini kullanarak review yapma.
instructions: 'Önce plan dosyasını oku (örn. docs/superpowers/plans/*.md). Mevcut orkestrasyon araçlarını, skill''leri ve recipe''leri değerlendir: erp-implementer recipe''si EgeSüt kurallarını (pre-check, ground_truth okuma, RPC wrapper zorunluluğu) garanti eder. Subagent''ların provider model ayarlarını kontrol et (deepseek-v4-flash/pro kullan, sonnet gönderme). Reviewer recipe''sini bu oturumda load edip adımlarını takip ederek kullan — Blackboard modunda task_get bekler, agent_id parametresi yoksa direkt kriterleri elle doğrula. Dosya syntax kontrolü (node --check) ve DB sorguları (supabase_rpc, supabase_query) ile doğrulama yap. Commit sonrası memory_add ile kodu belleğe kaydet.'
extensions:
- type: platform
  name: analyze
  description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
  display_name: Analyze
  bundled: true
  available_tools: []
- type: platform
  name: apps
  description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
  display_name: Apps
  bundled: true
  available_tools: []
- type: platform
  name: chatrecall
  description: Search past conversations and load session summaries for contextual memory
  display_name: Chat Recall
  bundled: true
  available_tools: []
- type: platform
  name: developer
  description: Write and edit files, and execute shell commands
  display_name: Developer
  bundled: true
  available_tools: []
- type: stdio
  name: duckduckgo
  description: Web search and page content fetching via DuckDuckGo
  cmd: /data/data/com.termux/files/usr/bin/uvx
  args:
  - duckduckgo-mcp-server
  envs: {}
  env_keys: []
  timeout: 30
  bundled: false
  available_tools: []
- type: platform
  name: Extension Manager
  description: Enable extension management tools for discovering, enabling, and disabling extensions
  display_name: Extension Manager
  bundled: true
  available_tools: []
- type: platform
  name: orchestrator
  description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
  display_name: Orchestrator
  bundled: true
  available_tools: []
- type: platform
  name: skills
  description: Discover and provide skill instructions from filesystem and builtins
  display_name: Skills
  bundled: true
  available_tools: []
- type: platform
  name: summarize
  description: Load files/directories and get an LLM summary in a single call
  display_name: Summarize
  bundled: true
  available_tools: []
- type: platform
  name: summon
  description: Load knowledge and delegate tasks to subagents
  display_name: Summon
  bundled: true
  available_tools: []
- type: platform
  name: Todo
  description: Enable a todo list for goose so it can keep track of what it is doing
  display_name: Todo
  bundled: true
  available_tools: []
- type: platform
  name: tom
  description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
  display_name: Top Of Mind
  bundled: true
  available_tools: []
- type: stdio
  name: tools-bank
  description: Memory, tasks, semantic search
  cmd: python3
  args:
  - /root/tools-bank/mcp_server/server.py
  - --stdio
  envs: {}
  env_keys: []
  timeout: 300
  bundled: false
  available_tools: []
settings:
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.0
activities:
- Plan dosyasını oku ve analiz et
- Subagent'larla paralel implementasyon
- Reviewer recipe'si ile doğrulama
- DB migration deploy ve test
- Commit + push + bellek güncelleme
author:
  contact: root
