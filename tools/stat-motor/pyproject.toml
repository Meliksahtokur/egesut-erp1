[project]
name = "stat-motor"
version = "0.1.0"
description = "EgeSut istatistik motoru"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "lifelines==0.30.3",
    # lead ruling: lifelines 0.30.3 pandas<3 ister (plan pini pandas>=3.0,<3.1 cozulemedi)
    "pandas>=2.2,<3.0",
    "pyarrow",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
stat-motor = "stat_motor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stat_motor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build]
ignore-vcs = true
