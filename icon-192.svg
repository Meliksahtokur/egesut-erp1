  <ellipse cx="124" cy="60" rx="10" ry="7" fill="#e8f5e1"/>
  <ellipse cx="68" cy="60" rx="6" ry="4" fill="#f4a3b0"/>
  <ellipse cx="124" cy="60" rx="6" ry="4" fill="#f4a3b0"/>
