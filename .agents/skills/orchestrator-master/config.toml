# Orchestrator-Master Configuration
# 
# This file controls default parameters for the orchestrator-master skill.
# Profiles allow quick switching between different operation modes.
# 
# Usage: load_skill("orchestrator-master") loads this config automatically.
# Override at runtime by passing profile=<name> in the agent_open prompt.

[defaults]
# Maximum concurrent sub-agents (system-level cap is 20)
max_concurrent_agents = 10

# Slots reserved for emergency/priority work
reserve_slots = 2

# Default model for sub-agents
default_model = "deepseek-v4-flash"

# Enable prefix-cache sharing across sub-agents
fork_context = true

# Maximum recursion depth (0=leaf, 1=spawn leaves, 2=spawn sub-orchs, 3=spawn sub-sub-orchs)
max_depth = 3

# Default agent type for sub-agents (see SKILL.md Agent Types section)
default_agent_type = "implementer"

# Consensus mode: "none" | "majority" | "reviewer"
consensus = "none"

# Maximum retry attempts per sub-agent before reporting failure
failure_budget = 3

[profiles]

[profiles.fast]
# Lightweight mode — single depth, limited concurrency
max_depth = 1
max_concurrent_agents = 4
reserve_slots = 1
# Inherits default_agent_type from [defaults]

[profiles.deep]
# Full recursive mode — sub-orchs with multi-level decomposition
max_depth = 3
max_concurrent_agents = 10
reserve_slots = 2
consensus = "none"
# Inherits default_agent_type from [defaults]

[profiles.critical]
# Maximum quality — triple review, Byzantine consensus
max_depth = 2
max_concurrent_agents = 6
reserve_slots = 3
consensus = "majority"
failure_budget = 5

[profiles.research]
# Read-only exploration — flat, parallel, no recursion
max_depth = 0
max_concurrent_agents = 8
default_agent_type = "explorer"
fork_context = true
consensus = "none"

# Hook settings — enable/disable lifecycle hooks
[hooks]
enabled = true
pre_dispatch = true
post_task = true
on_failure = true

# Checkpoint settings — Ring topology checkpoint/recovery
[checkpoint]
enabled = true
# Checkpoint every N pipeline steps
interval = 3
# Auto-recover on failure (retry failed step)
recovery = true

# Background workers — periodic tasks fired from post-task hook
[workers]
enabled = true

[workers.audit]
enabled = true
# Fire every N tasks
interval = 5

[workers.consolidate]
enabled = true
interval = 10

[workers.learn]
enabled = true
interval = 20

# Agent type defaults (per-type overrides)
[agent_types.explorer]
allowed_tools = [
  # Core read tools
  "read_file", "list_dir", "grep_files", "file_search",
  # Web/API
  "fetch_url", "web_search",
  # Code intelligence
  "gitnexus_query", "gitnexus_context", "gitnexus_impact", "gitnexus_detect_changes",
  # Semantic search
  "semantic_search",
  # Memory
  "memory_search", "note",
  # Supabase (read-only)
  "supabase_query", "supabase_rpc",
  # Graph analysis
  "graphify",
]
max_depth = 0
can_spawn = false

[agent_types.implementer]
allowed_tools = [
  # Core read + write
  "read_file", "list_dir", "grep_files", "file_search",
  "write_file", "edit_file", "apply_patch",
  # Shell
  "exec_shell",
  # Agent management
  "agent_open", "agent_eval", "agent_close",
  # Code intelligence
  "gitnexus_query", "gitnexus_context", "gitnexus_impact",
  "gitnexus_detect_changes", "gitnexus_cypher",
  # Semantic search
  "semantic_search",
  # Memory
  "memory_search", "memory_add", "note",
  # Supabase (full access)
  "supabase_query", "supabase_rpc",
  "supabase_insert", "supabase_delete",
  # Graph analysis
  "graphify",
  # Validation
  "validate_data",
  # Git
  "git_status", "git_diff", "git_log", "git_blame",
]
can_spawn = true

[agent_types.reviewer]
allowed_tools = [
  # Core read
  "read_file", "list_dir", "grep_files", "file_search",
  # Review
  "review", "exec_shell",
  # Code intelligence
  "gitnexus_query", "gitnexus_context", "gitnexus_impact",
  "gitnexus_detect_changes",
  # Semantic search
  "semantic_search",
  # Memory
  "memory_search", "memory_add", "note",
  # Supabase (read-only)
  "supabase_query", "supabase_rpc",
  # Graph analysis
  "graphify",
  # Git
  "git_diff", "git_log", "git_blame",
  # Validation
  "validate_data",
]
can_spawn = false

[agent_types.consolidator]
allowed_tools = [
  # Core read + limited write
  "read_file", "list_dir", "grep_files", "file_search",
  "write_file", "edit_file",
  # Handle large outputs
  "handle_read",
  # Code intelligence
  "gitnexus_query", "gitnexus_context",
  # Semantic search
  "semantic_search",
  # Memory
  "memory_search", "memory_add", "note",
  # Supabase (read-only)
  "supabase_query", "supabase_rpc",
  # Graph analysis
  "graphify",
]
can_spawn = false
