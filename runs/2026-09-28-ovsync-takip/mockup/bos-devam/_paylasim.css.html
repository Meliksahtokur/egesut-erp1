<!-- referans parça, sayfalara inline kopyalanır, chromium doğrudan açmaz -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111a0a;--bg2:#1a2812;
  --card:#f7f4ee;--card2:#edeae2;--card3:#e2ddd3;
  --ink:#1a1f14;--ink2:#3d4a32;--ink3:#6b7a5c;
  --green:#4e9a2a;--green2:#6abf3d;--green3:#98d96e;
  --amber:#c97d0a;--red:#c0321a;--red2:#e85535;--blue:#2a6bb5;--purple:#7c3aed;
}
html,body{background:#dfe3e6;}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;width:420px;margin:0 auto;padding:0 0 24px;}
.mock-tag{font-size:11px;color:#78909c;background:#dfe3e6;padding:8px 12px 6px;font-weight:700;}
.telefon{width:420px;min-height:700px;background:var(--bg);position:relative;overflow:hidden;border-radius:0 0 18px 18px;}
.arka-ekran{padding:16px;opacity:.5;filter:blur(1.5px);}
.arka-baslik{color:#fff;font-size:1.1rem;font-weight:800;margin-bottom:10px;}
.arka-kart{background:var(--bg2);border-radius:14px;padding:14px;margin-bottom:10px;color:#cfd8c4;font-size:.82rem;}
.mo{position:relative;background:rgba(10,20,5,.82);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;min-height:700px;}
.modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;padding-bottom:20px;box-shadow:0 -6px 24px rgba(0,0,0,.3);}
.m-handle{width:36px;height:4px;background:var(--card3);border-radius:2px;margin:10px auto 4px;}
.m-hdr{padding:4px 16px 12px;border-bottom:1px solid var(--card2);}
.m-eyebrow{font-size:.68rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.07em;}
.m-title{font-size:1.05rem;font-weight:800;color:var(--ink);margin-top:4px;}
.m-meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card3);color:var(--ink2);}
.m-body{padding:14px 16px;}
.btn{border:none;border-radius:12px;padding:12px;font-size:.88rem;font-weight:700;cursor:pointer;text-align:center;width:100%;}
.btn-g{background:var(--green);color:#fff;}
.btn-o{background:none;border:1.5px solid var(--card3);color:var(--ink2);}
.btn-r{background:var(--red);color:#fff;}
.btn-disabled{background:var(--card3);color:var(--ink3);}
.sonuc-grup{display:flex;gap:8px;margin-bottom:14px;}
.sonuc-cip{flex:1;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--card3);font-weight:700;font-size:.9rem;color:var(--ink2);}
.sonuc-cip.sc-on.sc-gebe{border-color:var(--green);background:rgba(78,154,42,.1);color:var(--green);}
.sonuc-cip.sc-on.sc-bos{border-color:var(--red);background:rgba(192,50,26,.1);color:var(--red);}
.ds-baslik{font-size:.72rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.ds-secenek{border:2px solid var(--card3);border-radius:14px;padding:12px 14px;margin-bottom:9px;background:#fff;}
.ds-secenek.secili{border-color:var(--green);background:rgba(78,154,42,.06);}
.ds-secenek.kilitli{background:var(--card2);opacity:.68;}
.ds-ust{display:flex;align-items:center;gap:10px;}
.ds-radio{width:20px;height:20px;border-radius:50%;border:2px solid #b7c2ab;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ds-secenek.secili .ds-radio{border-color:var(--green);}
.ds-secenek.secili .ds-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--green);}
.ds-secenek.kilitli .ds-radio{border-color:#c7cabf;}
.ds-metin{font-size:.92rem;font-weight:700;color:var(--ink);}
.ds-hemen{font-size:.6rem;font-weight:700;color:var(--green);background:rgba(78,154,42,.14);border-radius:8px;padding:2px 7px;margin-left:auto;white-space:nowrap;}
.ds-secenek.kilitli .ds-hemen{display:none;}
.ds-alt{font-size:.76rem;color:var(--ink3);margin-top:5px;padding-left:30px;line-height:1.4;}
.ds-kilit{font-size:.74rem;color:var(--amber);font-weight:700;margin-top:5px;padding-left:30px;}
.ds-ic{margin-top:10px;padding-left:30px;}
.ds-secim-satir{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ds-select,.ds-gun-input{border:1.5px solid var(--card3);border-radius:8px;padding:7px 10px;font-size:.82rem;background:#fff;color:var(--ink);font-weight:600;}
.ds-tarih-etiket{font-size:.78rem;color:var(--ink2);font-weight:600;background:var(--card2);padding:6px 10px;border-radius:8px;}
.ds-note{font-size:.72rem;color:var(--ink3);margin-top:10px;text-align:center;}
.ornek-kutu{margin:0 16px 12px;background:#fff8e1;border:1px dashed var(--amber);border-radius:10px;padding:8px 10px;font-size:.7rem;color:#8a5a00;line-height:1.5;}
</style>
