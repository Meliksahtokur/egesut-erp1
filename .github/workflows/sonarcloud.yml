name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clone devre dışı — tam history gerekli

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.organization=meliksahtokur
            -Dsonar.projectKey=Meliksahtokur_egesut-erp1
            -Dsonar.sources=js,index.html
            -Dsonar.inclusions=js/**/*.js,index.html
            -Dsonar.exclusions=js/lib/**,node_modules/**,tests/**,supabase/**,docs/**,research/**,review/**,**/*.min.js
            -Dsonar.javascript.file.suffixes=.js
            -Dsonar.cpd.js.minimumTokens=50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
