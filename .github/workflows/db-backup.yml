name: DB Backup

on:
  push:
    paths:
      - '.github/workflows/db-backup.yml'
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 03:00 TSİ
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Resolve IPv4 and dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # GitHub Actions runner IPv6 desteklemez (Network is unreachable).
          # Supabase DNS AAAA kaydını öncelikli döndürür.
          # Çözüm: hostname'i Python ile IPv4'e resolve et, pg_dump'a IPv4 adresini ver.
          HOST="db.zqnexqbdfvbhlxzelzju.supabase.co"
          PG_HOST=$(python3 -c "
import socket, sys
try:
    addr = socket.getaddrinfo('$HOST', 5432, socket.AF_INET)
    print(addr[0][4][0])
except Exception as e:
    print(f'IPv4 resolve failed: {e}', file=sys.stderr)
    sys.exit(1)
")
          echo "Resolved: $HOST → $PG_HOST:5432"
          pg_dump \
            --no-owner \
            --no-acl \
            --host="$PG_HOST" \
            --port=5432 \
            --username=postgres \
            --dbname=postgres \
            --format=custom \
            --compress=9 \
            --file=dump.pg
          echo "SUCCESS: dump.pg created ($(stat -c%s dump.pg) bytes)"

      - name: Encrypt dump
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass pass:"$BACKUP_PASSWORD" \
            -in dump.pg \
            -out egesut_$(date +%Y%m%d).pg.enc
          rm -f dump.pg

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: egesut-backup-${{ github.run_id }}
          path: egesut_*.pg.enc
          retention-days: 90
