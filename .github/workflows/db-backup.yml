name: DB Backup

on:
  push:
    paths:
      - '.github/workflows/db-backup.yml'
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 03:00 TSİ
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database via Docker pg_dump (PG17 server)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Direct host db.zqnexqbdfvbhlxzelzju.supabase.co has NO IPv4 record
          # (only AAAA/IPv6). GitHub Actions cannot use IPv6.
          # Solution: use Supabase session pooler which has IPv4.
          #   Pooler host: aws-1-eu-west-1.pooler.supabase.com  →  18.202.64.2
          #   Username format for pooler: postgres.<project-ref>
          #
          # Docker postgres:17 ensures pg_dump version matches server PG 17.6.
          docker run --rm -v "$PWD":/out -e PGPASSWORD \
            postgres:17 \
            pg_dump \
              --dbname="postgresql://postgres.zqnexqbdfvbhlxzelzju@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require" \
              --no-owner --no-acl \
              --exclude-schema='extensions' \
              --exclude-schema='graphql' \
              --exclude-schema='graphql_public' \
              --exclude-schema='net' \
              --exclude-schema='pgbouncer' \
              --exclude-schema='pgsodium' \
              --exclude-schema='pgsodium_masks' \
              --exclude-schema='realtime' \
              --exclude-schema='supabase_functions' \
              --format=custom --compress=9 \
              --file=/out/dump.pg
          echo "SUCCESS: $(stat -c%s dump.pg) bytes"

      - name: Encrypt dump
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass pass:"$BACKUP_PASSWORD" \
            -in dump.pg \
            -out egesut_$(date +%Y%m%d).pg.enc
          rm -f dump.pg

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: egesut-backup-${{ github.run_id }}
          path: egesut_*.pg.enc
          retention-days: 90
