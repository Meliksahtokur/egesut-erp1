name: DB Backup

on:
  push:
    paths:
      - '.github/workflows/db-backup.yml'
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 03:00 TSİ
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Dump database via Supavisor (pooler port 6543)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pg_dump \
            --no-owner \
            --no-acl \
            --host=db.zqnexqbdfvbhlxzelzju.supabase.co \
            --port=6543 \
            --username=postgres.db.zqnexqbdfvbhlxzelzju \
            --dbname=postgres \
            --format=custom \
            --compress=9 \
            --file=dump.pg

      - name: Encrypt dump
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass pass:"$BACKUP_PASSWORD" \
            -in dump.pg \
            -out egesut_$(date +%Y%m%d).pg.enc
          rm -f dump.pg

      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: egesut-backup-${{ github.run_id }}
          path: egesut_*.pg.enc
          retention-days: 90
