name: E2E Test Suite

on:
  push:
    branches:
      - main
      - fix/**
      - feat/**
      - chore/**
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_VERSION: '1.58.2'

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 1: E2E TEST (3 shard'a bölünür, paralel ~10dk)
  # ══════════════════════════════════════════════════════════════════════════════
  e2e-test:
    name: E2E Tests (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Shard ${{ matrix.shard }}/3)
        id: e2e-tests
        run: |
          npx playwright test \
            --project=chromium \
            --shard=${{ matrix.shard }}/3 \
            --reporter=list,html \
            --timeout=60000 \
            --retries=1 \
            tests/e2e.spec.js 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: |
            test-results/
            tests/report/
          retention-days: 7

      - name: Generate summary
        if: always()
        run: |
          echo "## E2E Test Shard ${{ matrix.shard }}/3" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 2: SMOKE TEST (Hızlı kontrol, ~5dk)
  # ══════════════════════════════════════════════════════════════════════════════
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Smoke tests
        id: smoke-tests
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=list,html \
            --timeout=30000 \
            tests/smoke.spec.js 2>&1 || true

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            test-results/
            tests/report/
          retention-days: 7

      - name: Generate summary
        if: always()
        run: |
          echo "## Smoke Tests" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 3: TEST ÖZETİ
  # ══════════════════════════════════════════════════════════════════════════════
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-test, smoke-test]
    
    steps:
      - name: Generate combined summary
        run: |
          echo "# Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Shard 1/3 | ${{ needs.e2e-test.outputs.status_1 || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Shard 2/3 | ${{ needs.e2e-test.outputs.status_2 || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Shard 3/3 | ${{ needs.e2e-test.outputs.status_3 || 'completed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test Reports (7 gün saklanır)" >> $GITHUB_STEP_SUMMARY

      - name: Fail on test failure
        if: needs.e2e-test.result == 'failure' || needs.smoke-test.result == 'failure'
        run: |
          echo "❌ Some tests failed!"
          exit 1
