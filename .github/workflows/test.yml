name: E2E Tests

on:
  push:
    branches: [main, fix/**, feat/**, chore/**]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard number (1, 2, 3, or all)"
        required: false
        default: "all"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright E2E (${{ matrix.shard }}/${{ matrix.shard_total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        shard: [1, 2, 3]
        shard_total: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
        run: |
          npx playwright test \
            --reporter=list \
            --shard=${{ matrix.shard }}/${{ matrix.shard_total }} \
            --timeout=30000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: tests/report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-shard-${{ matrix.shard }}
          path: .playwright/
          retention-days: 7

  smoke-test:
    name: Smoke Test (9 critical checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: |
          npx playwright test \
            tests/smoke.spec.js \
            --reporter=list \
            --timeout=30000

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: tests/report/
          retention-days: 7

