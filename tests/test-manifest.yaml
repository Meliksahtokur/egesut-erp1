#         "kilit" yalniz DB kilidi/yaris anlaminda R5 sayildi; UI "🔒 kilitli kart" (hard-block) R5 degil.
#   target_file: insan-ui -> runs/2026-09-28-ovsync-takip/ui-test-listesi.md;
#         DB yarisi (T-72/T-73/T-87) -> tests/concurrency/ovsync-takip-t72b.mjs;
#         digerleri ilk-listelenen katmana gore tests/sql/ovsync_takip_test.sql |
#         tests/e2e/ovsync-takip.spec.js (aile adi yukaridaki bolum yorumunda; -s2/-s3 sonek yok) |
#         tests/unit/ovsync-takip.test.js
#   max_self_repair: sablon geregi 2.

