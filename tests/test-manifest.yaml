# tests/test-manifest.yaml
# Uretim: katalog v3'ten (docs/plans/2026-09-28-ovsync-takip-ekrani/test-senaryolari.md, T-01..T-100)
# Tarih: 2026-09-30. Kaynak dosyaya dokunulmadi.
# Kurallar:
#   risk: govde anahtar kelimeleriyle sirayla ilk eslesen (R6 acik sozlesme > R5 yarisi/kilit/deadlock
#         > R4 ACL/anon/EXECUTE/imza/toplu/bulk/preflight/REVOKE > R3 atomik/transaction/yarim/tek-islem/XOR/guard/RAISE
